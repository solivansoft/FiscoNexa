name: Contrato e politica de acesso da API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements-api.txt
      - run: python tests/test_api_contract.py
      - run: python -m unittest discover -s tests -p test_api_contract.py
